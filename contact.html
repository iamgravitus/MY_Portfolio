
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Contact Form</title>

    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

    <!-- Contact Form Section -->
   
<main>

    <section class="contact-container">

        <!-- LEFT SIDE: INTRODUCTION -->
        <div class="intro-content">

            <p class="intro-label">COMPUTER SCIENCE STUDENT</p>

            <h1>
                Hello, my name is
                <span>Stanley Joseph</span>
                I'm a Frontend Developer
            </h1>

            <p class="intro-text">
                I create modern and responsive websites.
                I'm passionate about learning new technologies
                and building useful digital experiences.
            </p>

        </div>


        <!-- RIGHT SIDE: CONTACT FORM -->
        <div class="contact-form">

            <h1>Send a Message</h1>

            <p>Fill out the form below and I'll get back to you soon.</p>

            <form action="#" method="POST">

                <!-- Name Input -->
                <div class="input-box">
                    <img src="https://www.svgrepo.com/show/506667/person.svg" alt="person">

                    <input type="text" name="name" placeholder="Your Name" required>
                </div>

                <!-- Email Input -->
                <div class="input-box">
                    <img src="https://www.svgrepo.com/show/287439/envelope-mail.svg" alt="envelope">

                    <input type="email" name="email" placeholder="Your Email" required>
                </div>

                <!-- Subject Selection -->
                <div class="input-box">
                    <img src="https://www.svgrepo.com/show/450016/boxes.svg" alt="box">

                    <select name="subject" required>
                        <option value="" disabled selected>Select Subject</option>
                        <option value="web-design">Web Design</option>
                        <option value="web-development">Web Development</option>
                        <option value="collaboration">Collaboration</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Message Input -->
                <div class="input-box message-box">
                    <textarea name="message" placeholder="Your Message..." required></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit">
                    Send Message
                    <img src="https://www.svgrepo.com/show/533270/message-square-lines-alt.svg" alt="message icon">
                </button>

            </form>

        </div>

    </section>

</main>


</body>
</html>
